<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>神埼鉄道 運行情報・特急予約</title>

    <!-- PWA & Web Push Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#521EB7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="神埼鉄道" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon.png" />
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position: fixed; inset: 0; background-color: #521EB7; display: flex; align-items: center; justify-content: center; z-index: 9999; overflow: hidden;">
        <style>
          .splash-sp-container { display: flex; width: 100vw; height: 100vh; align-items: center; justify-content: center; }
          .splash-pc-container { display: none; width: 100vw; height: 100vh; align-items: center; justify-content: center; }
          @media (min-width: 640px) and (min-aspect-ratio: 1/1) {
            .splash-sp-container { display: none !important; }
            .splash-pc-container { display: flex !important; }
          }
        </style>
        <!-- Smartphone (Portrait / Mobile) Splash Screen Image -->
        <div class="splash-sp-container">
          <img src="/splash-sp.png" alt="ロード中..." style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
        <!-- PC / Tablet (Landscape) Splash Screen Image -->
        <div class="splash-pc-container">
          <img src="/splash-pc.png" alt="ロード中..." style="width: 100%; height: 100%; object-fit: cover;" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
